name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege by default: a read-only token is all any job needs except release, which re-grants
# contents: write to publish the GitHub Release. Fork PRs get a read-only token from GitHub regardless.
permissions:
  contents: read

# Fork-safety model. THIS REPO IS PRIVATE, so there is no untrusted-fork surface: a pull request can
# only come from someone who already has access to the repo. Every job therefore runs on the
# self-hosted FRAME-DESK runner, which costs no billable minutes. Signing secrets live ONLY in the
# release job (GitHub-hosted, tag-triggered).
#
# IF THIS REPO IS EVER MADE PUBLIC, move the `check` job back to `runs-on: ubuntu-latest` before
# flipping the switch — otherwise a fork PR's untrusted code executes on the self-hosted runner. Also
# enable "Require approval for all outside collaborators" (Settings → Actions → General → Fork pull
# request workflows). The heavyweight build + instrumented jobs are already gated to push events on
# THIS repo (github.repository), so a fork PR can never select them either way.
jobs:
  # Quick checks on PRs — self-hosted: private repo, so no fork surface, and GitHub-hosted minutes on
  # a private repo are billable. A batch of dependabot PRs exhausted the 2,000-minute monthly
  # allowance, and past that GitHub fails the job at its upload step with a misleading "Artifact
  # storage quota has been hit" (storage was in fact near-empty).
  check:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, android]

    env:
      ANDROID_HOME: /opt/android-sdk

    steps:
      - uses: actions/checkout@v4

      # Fails the job if gradle-wrapper.jar is not an official Gradle release, before ./gradlew
      # runs it. A wrapper bump (Dependabot) replaces this binary; nothing else checks it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The android-actions/setup-android step that used to sit here existed only because the
      # GitHub-hosted image did not ship baromi's compileSdk. FRAME-DESK already has it — the build
      # job on the same runner provisions nothing and succeeds — so it is no longer needed.
      # No actions/cache either: ~/.gradle persists between runs on the self-hosted runner.

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Run lint and unit tests
        run: ./gradlew lint test

  # Full build on push to main — runs on self-hosted FRAME-DESK.
  # Gated to pushes on this repo so a fork PR can never run on the self-hosted runner.
  build:
    if: github.event_name == 'push' && github.repository == 'soult-io/baromi-android'
    runs-on: [self-hosted, linux, android]

    env:
      ANDROID_HOME: /opt/android-sdk

    steps:
      - uses: actions/checkout@v4

      # Fails the job if gradle-wrapper.jar is not an official Gradle release, before ./gradlew
      # runs it. A wrapper bump (Dependabot) replaces this binary; nothing else checks it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run lint, tests, and build APKs
        run: ./gradlew lint test assembleDebug assembleRelease bundleRelease

      - name: Copy build outputs for MCP access
        run: |
          install -m 0664 app/build/outputs/apk/debug/app-debug.apk /srv/android/builds/baromi-debug.apk || echo "Debug APK not found, skipping"
          install -m 0664 app/build/outputs/apk/release/app-release-unsigned.apk /srv/android/builds/baromi-release-unsigned.apk || echo "Release APK not found, skipping"
          install -m 0664 app/build/outputs/bundle/release/app-release.aab /srv/android/builds/baromi-release.aab || echo "Release AAB not found, skipping"

      # The debug APK is deliberately NOT uploaded as a GitHub artifact: the step above already
      # copies it to /srv/android/builds on the self-hosted runner, and no download-artifact step
      # references baromi-debug. The release APK/AAB below stay — the release job downloads them.

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: baromi-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: baromi-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: warn

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results*.html
          retention-days: 30
          if-no-files-found: ignore

      - name: Report build sizes
        if: always()
        run: |
          echo "## Build Sizes" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab; do
            [ -f "$f" ] && echo "| $(basename $f) | $(du -h $f | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          done

  # Instrumented tests via Gradle Managed Devices (aospAtd) — runs after build, does not block release.
  instrumented-tests:
    if: >-
      github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'soult-io/baromi-android'
    needs: build
    runs-on: [self-hosted, linux, android]

    env:
      ANDROID_HOME: /opt/android-sdk

    steps:
      - uses: actions/checkout@v4

      # Fails the job if gradle-wrapper.jar is not an official Gradle release, before ./gradlew
      # runs it. A wrapper bump (Dependabot) replaces this binary; nothing else checks it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run instrumented tests (Gradle Managed Device)
        run: ./gradlew :app:aospAtdDebugAndroidTest
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/
          retention-days: 30
          if-no-files-found: ignore

  # Sign + publish on a v* tag — runs on GitHub-hosted (holds the signing secrets, no self-hosted needed).
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'soult-io/baromi-android'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download unsigned release APK
        uses: actions/download-artifact@v4
        with:
          name: baromi-release-unsigned
          path: unsigned/

      - name: Download release AAB
        uses: actions/download-artifact@v4
        with:
          name: baromi-release-aab
          path: aab/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode signing keystore
        run: echo "${{ secrets.BAROMI_KEYSTORE_BASE64 }}" | base64 -d > baromi-release.jks

      - name: Sign APK with apksigner
        run: |
          mkdir -p signed
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          $APKSIGNER sign \
            --ks baromi-release.jks \
            --ks-pass env:BAROMI_KEYSTORE_PASSWORD \
            --ks-key-alias "$BAROMI_KEY_ALIAS" \
            --key-pass env:BAROMI_KEY_PASSWORD \
            --out signed/baromi-release.apk \
            unsigned/app-release-unsigned.apk
        env:
          BAROMI_KEYSTORE_PASSWORD: ${{ secrets.BAROMI_KEYSTORE_PASSWORD }}
          BAROMI_KEY_ALIAS: ${{ secrets.BAROMI_KEY_ALIAS }}
          BAROMI_KEY_PASSWORD: ${{ secrets.BAROMI_KEY_PASSWORD }}

      - name: Sign AAB with jarsigner
        run: |
          mkdir -p signed-aab
          cp aab/app-release.aab signed-aab/baromi-release.aab
          jarsigner -keystore baromi-release.jks \
            -storepass "$BAROMI_KEYSTORE_PASSWORD" \
            -keypass "$BAROMI_KEY_PASSWORD" \
            signed-aab/baromi-release.aab \
            "$BAROMI_KEY_ALIAS"
        env:
          BAROMI_KEYSTORE_PASSWORD: ${{ secrets.BAROMI_KEYSTORE_PASSWORD }}
          BAROMI_KEY_ALIAS: ${{ secrets.BAROMI_KEY_ALIAS }}
          BAROMI_KEY_PASSWORD: ${{ secrets.BAROMI_KEY_PASSWORD }}

      - name: Generate SHA-256 checksums
        run: |
          cd signed && sha256sum baromi-release.apk > baromi-release.apk.sha256
          cd ../signed-aab && sha256sum baromi-release.aab > baromi-release.aab.sha256

      - name: Create GitHub Release
        # Third-party action on the job that holds the signing secrets — pin to a commit SHA so a
        # compromised/retagged upstream can't inject code near the keystore. Update deliberately.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            signed/baromi-release.apk
            signed/baromi-release.apk.sha256
            signed-aab/baromi-release.aab
            signed-aab/baromi-release.aab.sha256
          generate_release_notes: true

      - name: Cleanup keystore
        if: always()
        run: rm -f baromi-release.jks
