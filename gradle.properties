org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP (Room compiler) still registers generated sources via kotlin.sourceSets, which AGP 9
# built-in Kotlin disallows by default. Documented escape hatch until KSP registers them via
# android.sourceSets. See https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false
